# El código vive dentro de smartrecruit-fuente.zip: Netlify lo descomprime y compila.
[build]
  command = "rm -rf app && (unzip -q -o smartrecruit-fuente.zip -d app || python3 -m zipfile -e smartrecruit-fuente.zip app) && cd app && npm install --no-audit --no-fund && npm run build"
  publish = "app/dist"

[functions]
  directory = "app/netlify/functions"
  node_bundler = "esbuild"
